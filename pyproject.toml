[project]
name = "pptx-agent"
version = "0.1.0"
description = "LLM-driven slide agent: content -> design system -> HTML layout -> (v1) native PPTX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "openai>=3.16.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "pywin32>=312 ; sys_platform == 'win32'",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
pptx-agent = "pptx_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pptx_agent"]
